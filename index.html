<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Стежка до власної квітки папороті</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap');

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(
            ellipse at 50% 50%,
            #20372b 0%,
            #0b1711 38%,
            #020604 78%,
            #000 100%
        );

    color: #e8e2cf;

    font-family:
        "Rutenia",
        "Rutenia Unicode",
        "Cormorant Garamond",
        Georgia,
        serif;
}

.forest,
.fog {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.forest {
    background:
        radial-gradient(
            ellipse at 50% 48%,
            rgba(92, 126, 84, 0.18),
            transparent 45%
        ),
        radial-gradient(
            ellipse at 50% 110%,
            rgba(25, 54, 38, 0.42),
            transparent 58%
        ),
        linear-gradient(
            90deg,
            rgba(0, 0, 0, 0.35),
            transparent 25%,
            transparent 75%,
            rgba(0, 0, 0, 0.35)
        );
}

.fog {
    inset: -20%;

    background:
        radial-gradient(
            ellipse at 50% 50%,
            rgba(160, 180, 145, 0.06),
            transparent 50%
        );

    filter: blur(35px);

    animation:
        fogMove 22s ease-in-out infinite alternate;
}

@keyframes fogMove {

    from {
        transform:
            translate(-3%, 1%);
    }

    to {
        transform:
            translate(3%, -1%);
    }
}


/* Центральна сцена */

.intro {
    position: relative;

    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px;
}


/* Область тексту */

.story {
    position: relative;

    width: min(1100px, 92vw);
    height: 260px;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* Окрема фраза */

.line {
    position: absolute;

    width: 100%;

    padding: 0 12px;

    opacity: 0;

    transform:
        translateY(12px)
        scale(0.25);

    filter: blur(18px);

    font-size:
        clamp(31px, 5vw, 66px);

    font-weight: 400;

    line-height: 1.18;

    letter-spacing: 3px;

    color: #e1ddcf;

    text-shadow:
        0 0 8px rgba(210, 225, 200, 0.10),
        0 0 35px rgba(120, 155, 110, 0.10);

    transition:
        opacity 0.7s ease,
        transform 2.5s cubic-bezier(.16, .8, .18, 1),
        filter 2.2s ease;
}


/*
   Коли фраза стає видимою
*/

.line.visible {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);

    filter: blur(0);
}


/*
   Розчинення фрази
*/

.line.hidden {
    opacity: 0;

    transform:
        translateY(-10px)
        scale(1.08);

    filter: blur(9px);
}


/*
   Окремі літери.

   Вони стартують із різних точок
   навколо темного центру,
   а потім збираються у слово.
*/

.line .letter {
    display: inline-block;

    opacity: 0;

    transform:
        translate(var(--x), var(--y))
        rotate(var(--r))
        scale(0.35);

    filter: blur(7px);

    transition:
        opacity 1.2s ease,
        transform 1.9s cubic-bezier(.17, .82, .2, 1),
        filter 1.5s ease;

    transition-delay:
        var(--d);
}


/*
   Літери займають своє місце
*/

.line.visible .letter {
    opacity: 1;

    transform:
        translate(0, 0)
        rotate(0)
        scale(1);

    filter: blur(0);
}


/* Фінальна фраза */

.final-line {
    font-size:
        clamp(36px, 5.8vw, 78px);

    color: #fff3ad;

    font-weight: 500;

    letter-spacing: 4px;

    text-shadow:
        0 0 8px rgba(255, 244, 166, 0.90),
        0 0 24px rgba(247, 222, 104, 0.85),
        0 0 55px rgba(221, 190, 54, 0.70),
        0 0 100px rgba(188, 157, 37, 0.45);
}


/*
   Сяйво квітки папороті
*/

.final-line.visible {
    animation:
        fernGlow 2.8s ease-in-out infinite alternate;
}

@keyframes fernGlow {

    from {
        text-shadow:
            0 0 9px rgba(255, 244, 166, 0.85),
            0 0 24px rgba(247, 222, 104, 0.72),
            0 0 55px rgba(221, 190, 54, 0.55),
            0 0 90px rgba(188, 157, 37, 0.35);
    }

    to {
        text-shadow:
            0 0 18px rgba(255, 252, 201, 1),
            0 0 38px rgba(255, 226, 91, 0.95),
            0 0 78px rgba(235, 202, 65, 0.82),
            0 0 130px rgba(194, 160, 34, 0.55);
    }
}


/* Кнопка */

.enter-button {
    position: absolute;

    bottom: 12vh;
    left: 50%;

    transform:
        translateX(-50%)
        translateY(20px);

    opacity: 0;

    pointer-events: none;

    padding:
        16px 34px;

    border:
        1px solid
        rgba(216, 201, 134, 0.55);

    border-radius: 50px;

    background:
        rgba(8, 18, 14, 0.72);

    color: #d8c986;

    font-family: inherit;

    font-size: 21px;

    letter-spacing: 2px;

    cursor: pointer;

    transition:
        opacity 2s ease,
        transform 1s ease,
        background 0.5s ease,
        box-shadow 0.5s ease;
}

.enter-button.show {
    opacity: 1;

    pointer-events: auto;

    transform:
        translateX(-50%)
        translateY(0);
}

.enter-button:hover {
    background:
        rgba(35, 55, 42, 0.9);

    box-shadow:
        0 0 22px rgba(216, 201, 134, 0.3),
        0 0 60px rgba(216, 201, 134, 0.15);
}


/* Трипільський знак */

.symbol {
    display: block;

    margin-bottom: 5px;

    font-size: 25px;

    opacity: 0.85;
}


/* Зникнення сцени */

.fade-out {
    animation:
        disappear 2s ease forwards;
}

@keyframes disappear {

    from {
        opacity: 1;
    }

    to {
        opacity: 0;
    }
}


/* Мобільні пристрої */

@media (max-width: 600px) {

    .story {
        height: 220px;
    }

    .line {
        font-size:
            clamp(28px, 8vw, 44px);

        letter-spacing: 1.5px;
    }

    .final-line {
        font-size:
            clamp(32px, 9vw, 52px);
    }

    .enter-button {
        font-size: 18px;

        padding:
            14px 26px;
    }
}
</style>
</head>


<body>

<div class="forest"></div>

<div class="fog"></div>


<main
    class="intro"
    id="intro"
>

    <div class="story">

        <div
            class="line"
            data-time="5000"
        >
            Кажуть
        </div>


        <div
            class="line"
            data-time="5200"
        >
            квітки папороті не існує
        </div>


        <div
            class="line"
            data-time="5200"
        >
            але деякі стежки
        </div>


        <div
            class="line"
            data-time="6800"
        >
            ведуть тебе у темряву твоїх страхів
        </div>


        <div
            class="line"
            data-time="7000"
        >
            саме така подорож
        </div>


        <div
            class="line"
            data-time="5200"
        >
            винагороджує тебе
        </div>


        <div
            class="line final-line"
            data-time="8000"
        >
            квіткою папороті
        </div>

    </div>


    <button
        class="enter-button"
        id="startButton"
    >

        <span class="symbol">
            𒀭
        </span>

        Увійти до стежки

    </button>

</main>


<script>

const lines =
    [
        ...document.querySelectorAll(".line")
    ];


const button =
    document.getElementById(
        "startButton"
    );


const intro =
    document.getElementById(
        "intro"
    );


/* --------------------------------
   ЗВУК
-------------------------------- */

let audioContext;


function unlockAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }


    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();
    }
}


function createLeafSound() {

    unlockAudio();


    if (
        !audioContext ||
        audioContext.state ===
        "suspended"
    ) {
        return;
    }


    const duration = 1.15;


    const buffer =
        audioContext.createBuffer(
            1,
            audioContext.sampleRate *
                duration,
            audioContext.sampleRate
        );


    const data =
        buffer.getChannelData(0);


    for (
        let i = 0;
        i < data.length;
        i++
    ) {

        const t =
            i / data.length;


        const fade =
            Math.sin(
                Math.PI * t
            );


        const variation =
            0.45 +
            Math.random() * 0.55;


        data[i] =
            (
                Math.random() * 2 - 1
            )
            *
            fade
            *
            variation
            *
            0.25;
    }


    const source =
        audioContext
            .createBufferSource();


    source.buffer =
        buffer;


    const filter =
        audioContext
            .createBiquadFilter();


    filter.type =
        "bandpass";


    filter.frequency.value =
        2600;


    filter.Q.value =
        0.38;


    const gain =
        audioContext.createGain();


    const now =
        audioContext.currentTime;


    gain.gain.setValueAtTime(
        0.0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        0.055,
        now + 0.13
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );


    source
        .connect(filter)
        .connect(gain)
        .connect(
            audioContext.destination
        );


    source.start();
}


/* --------------------------------
   ЛІТЕРИ
-------------------------------- */

function prepareLetters(line) {

    if (line.dataset.ready) {
        return;
    }


    const text =
        line.textContent;


    line.textContent =
        "";


    [
        ...text
    ].forEach(
        (char, index) => {

            const span =
                document.createElement(
                    "span"
                );


            span.className =
                "letter";


            span.textContent =
                char === " "
                    ? "\u00A0"
                    : char;


            const angle =
                Math.random() *
                Math.PI * 2;


            const distance =
                80 +
                Math.random() * 180;


            const x =
                Math.cos(angle) *
                distance;


            const y =
                Math.sin(angle) *
                distance;


            const rotation =
                (
                    Math.random() *
                    26 -
                    13
                ).toFixed(1);


            const delay =
                (
                    index * 0.045 +
                    Math.random() * 0.12
                ).toFixed(2)
                + "s";


            span.style.setProperty(
                "--x",
                x + "px"
            );


            span.style.setProperty(
                "--y",
                y + "px"
            );


            span.style.setProperty(
                "--r",
                rotation + "deg"
            );


            span.style.setProperty(
                "--d",
                delay
            );


            line.appendChild(
                span
            );
        }
    );


    line.dataset.ready =
        "1";
}


/* --------------------------------
   ПОЯВА ФРАЗ
-------------------------------- */

function showLine(index) {

    if (
        index >=
        lines.length
    ) {

        setTimeout(
            () => {

                button.classList.add(
                    "show"
                );

            },
            1500
        );

        return;
    }


    const line =
        lines[index];


    prepareLetters(line);


    /*
       Спочатку шелест.
       Потім літери виринають
       із темного центру.
    */

    createLeafSound();


    setTimeout(
        () => {

            line.classList.remove(
                "hidden"
            );


            line.classList.add(
                "visible"
            );

        },
        260
    );


    const time =
        Number(
            line.dataset.time
        );


    setTimeout(
        () => {

            line.classList.remove(
                "visible"
            );


            line.classList.add(
                "hidden"
            );


            setTimeout(
                () => {

                    showLine(
                        index + 1
                    );

                },
                1700
            );

        },
        time + 300
    );
}


/*
   Перша взаємодія користувача
   розбуджує звук у браузері.
*/

document.addEventListener(
    "pointerdown",
    unlockAudio,
    {
        once: true
    }
);


/* --------------------------------
   ПОЧАТОК
-------------------------------- */

setTimeout(
    () => {

        showLine(0);

    },
    2200
);


/* --------------------------------
   КНОПКА
-------------------------------- */

button.addEventListener(
    "click",
    () => {

        intro.classList.add(
            "fade-out"
        );


        setTimeout(
            () => {

                console.log(
                    "Починається подорож до темного лісу"
                );

            },
            2000
        );
    }
);

</script>

</body>
</html>
