<!DOCTYPE html>
<html lang="uk">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Стежка до власної квітки папороті</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center,
            #243b2d 0%,
            #102017 32%,
            #06100b 65%,
            #010403 100%
        );

    color: #e8dfc8;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;
}


/* --------------------------------
   ЛІС
-------------------------------- */

.forest {
    position: fixed;
    inset: 0;

    background:

        radial-gradient(
            ellipse at center,
            rgba(180, 166, 103, 0.10) 0%,
            rgba(50, 80, 57, 0.10) 25%,
            transparent 60%
        ),

        radial-gradient(
            ellipse at 50% 40%,
            rgba(220, 194, 108, 0.05),
            transparent 35%
        );

    pointer-events: none;
}


/* --------------------------------
   ТУМАН
-------------------------------- */

.fog {
    position: fixed;
    inset: -25%;

    background:

        radial-gradient(
            ellipse at 50% 50%,
            rgba(160, 177, 145, 0.055),
            transparent 52%
        ),

        radial-gradient(
            ellipse at 45% 55%,
            rgba(200, 188, 125, 0.035),
            transparent 35%
        );

    filter: blur(35px);

    animation:
        fogMove 20s ease-in-out infinite alternate;

    pointer-events: none;
}

@keyframes fogMove {

    from {
        transform:
            translateX(-3%)
            translateY(1%);
    }

    to {
        transform:
            translateX(3%)
            translateY(-2%);
    }

}


/* --------------------------------
   ЦЕНТРАЛЬНЕ СЯЙВО
-------------------------------- */

.center-light {

    position: fixed;

    left: 50%;
    top: 50%;

    width: 12px;
    height: 12px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: rgba(235, 210, 128, 0.65);

    box-shadow:

        0 0 20px
        rgba(235, 210, 128, 0.35),

        0 0 60px
        rgba(190, 170, 100, 0.20),

        0 0 120px
        rgba(120, 150, 100, 0.10);

    opacity: 0.55;

    animation:
        centerPulse 5s ease-in-out infinite;

    pointer-events: none;
}

@keyframes centerPulse {

    0%,
    100% {
        transform:
            translate(-50%, -50%)
            scale(0.75);

        opacity: 0.35;
    }

    50% {
        transform:
            translate(-50%, -50%)
            scale(1.5);

        opacity: 0.8;
    }

}


/* --------------------------------
   ОСНОВНА СЦЕНА
-------------------------------- */

.intro {

    position: relative;

    width: 100vw;
    height: 100vh;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px;
}


/* --------------------------------
   ТЕКСТОВИЙ ЦЕНТР
-------------------------------- */

.story {

    position: relative;

    width: min(1050px, 92vw);

    height: 190px;

    display: flex;

    align-items: center;
    justify-content: center;

}


/* --------------------------------
   ОКРЕМА ФРАЗА
-------------------------------- */

.line {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 100%;

    transform:
        translate(-50%, -50%)
        scale(0.15);

    opacity: 0;

    filter:
        blur(12px);

    font-family:
        "Cinzel",
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size:
        clamp(29px, 4.2vw, 58px);

    font-weight: 400;

    letter-spacing:
        0.12em;

    line-height: 1.3;

    color:
        rgba(222, 207, 164, 0.95);

    text-shadow:

        0 0 10px
        rgba(220, 201, 139, 0.18),

        0 0 35px
        rgba(190, 170, 100, 0.10);

    transition:
        opacity 2.4s ease,
        transform 2.8s cubic-bezier(.16,.82,.25,1),
        filter 2.4s ease;

    pointer-events: none;

}


/* --------------------------------
   ЛІТЕРИ
-------------------------------- */

.letter {

    display: inline-block;

    opacity: 0;

    transform:
        scale(0.15);

    filter:
        blur(8px);

    transition:

        opacity 1.1s ease,

        transform
        1.5s cubic-bezier(.17,.84,.25,1),

        filter
        1.5s ease;

}


/*
   Літера народжується
   з темного центру.
*/

.letter.appear {

    opacity: 1;

    transform:
        scale(1);

    filter:
        blur(0);
}


/* --------------------------------
   ФРАЗА ВИДИМА
-------------------------------- */

.line.visible {

    opacity: 1;

    transform:
        translate(-50%, -50%)
        scale(1);

    filter:
        blur(0);
}


/* --------------------------------
   ФРАЗА ЗНИКАЄ
-------------------------------- */

.line.hidden {

    opacity: 0;

    transform:
        translate(-50%, -50%)
        scale(1.06);

    filter:
        blur(7px);
}


/* --------------------------------
   ОСОБЛИВІ ФРАЗИ
-------------------------------- */

.line.special {

    font-size:
        clamp(34px, 5vw, 67px);

    letter-spacing:
        0.16em;
}


/* --------------------------------
   ФІНАЛЬНА КВІТКА ПАПОРОТІ
-------------------------------- */

.final-line {

    color:
        #f3d979;

    font-size:
        clamp(38px, 5.5vw, 74px);

    font-weight:
        500;

    letter-spacing:
        0.14em;

    text-shadow:

        0 0 10px
        rgba(255, 230, 142, 0.75),

        0 0 25px
        rgba(245, 213, 111, 0.55),

        0 0 55px
        rgba(224, 191, 89, 0.38),

        0 0 100px
        rgba(210, 180, 80, 0.22);

}


/* --------------------------------
   СЯЙВО ФІНАЛЬНОЇ ФРАЗИ
-------------------------------- */

.final-line.visible {

    animation:
        finalGlow 3.5s ease-in-out infinite alternate;
}

@keyframes finalGlow {

    from {

        text-shadow:

            0 0 10px
            rgba(255, 230, 142, 0.65),

            0 0 30px
            rgba(245, 213, 111, 0.45),

            0 0 60px
            rgba(224, 191, 89, 0.25);
    }

    to {

        text-shadow:

            0 0 18px
            rgba(255, 235, 157, 0.95),

            0 0 45px
            rgba(248, 217, 115, 0.75),

            0 0 90px
            rgba(230, 195, 88, 0.48),

            0 0 140px
            rgba(210, 180, 80, 0.22);
    }

}


/* --------------------------------
   КНОПКА
-------------------------------- */

.enter-button {

    position: absolute;

    bottom: 12vh;

    left: 50%;

    transform:
        translateX(-50%)
        translateY(20px);

    opacity: 0;

    pointer-events: none;

    padding:
        17px 38px;

    border:
        1px solid
        rgba(224, 200, 125, 0.55);

    border-radius:
        50px;

    background:
        rgba(4, 12, 8, 0.72);

    color:
        #e5cf8c;

    font-family:
        "Cinzel",
        serif;

    font-size:
        18px;

    letter-spacing:
        0.08em;

    cursor: pointer;

    box-shadow:

        0 0 20px
        rgba(220, 195, 120, 0.08);

    transition:

        opacity 2s ease,

        transform 1s ease,

        background 0.5s ease,

        box-shadow 0.7s ease;

}


.enter-button.show {

    opacity: 1;

    pointer-events: auto;

    transform:
        translateX(-50%)
        translateY(0);
}


.enter-button:hover {

    background:
        rgba(28, 47, 34, 0.86);

    box-shadow:

        0 0 25px
        rgba(235, 207, 125, 0.22),

        0 0 60px
        rgba(210, 180, 90, 0.10);

}


.symbol {

    display: block;

    margin-bottom: 6px;

    font-size: 25px;

    opacity: 0.85;
}


/* --------------------------------
   ПІДКАЗКА ПРО ЗВУК
-------------------------------- */

.sound-hint {

    position: fixed;

    left: 50%;

    bottom: 3.5vh;

    transform:
        translateX(-50%);

    color:
        rgba(215, 207, 179, 0.48);

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:
        15px;

    letter-spacing:
        0.08em;

    opacity: 0;

    transition:
        opacity 2s ease;

    pointer-events: none;
}

.sound-hint.show {
    opacity: 1;
}


/* --------------------------------
   ПІСЛЯ НАТИСКАННЯ
-------------------------------- */

.fade-out {

    animation:
        disappear 2.5s ease forwards;
}

@keyframes disappear {

    from {
        opacity: 1;
    }

    to {
        opacity: 0;
    }

}


/* --------------------------------
   МОБІЛЬНІ
-------------------------------- */

@media (max-width: 600px) {

    .line {

        font-size:
            clamp(25px, 7vw, 40px);

        letter-spacing:
            0.07em;
    }

    .line.special {

        font-size:
            clamp(28px, 8vw, 44px);
    }

    .final-line {

        font-size:
            clamp(31px, 9vw, 48px);
    }

    .enter-button {

        font-size: 16px;

        padding:
            15px 28px;
    }

}

</style>

</head>


<body>


<div class="forest"></div>

<div class="fog"></div>

<div class="center-light"></div>


<main
    class="intro"
    id="intro"
>


    <div
        class="story"
        id="story"
    >


        <div
            class="line"
            data-time="4300"
        >
            Кажуть
        </div>


        <div
            class="line"
            data-time="5000"
        >
            квітки папороті не існує
        </div>


        <div
            class="line"
            data-time="4800"
        >
            але деякі стежки
        </div>


        <div
            class="line special"
            data-time="4000"
        >
            ведуть тебе
        </div>


        <div
            class="line special"
            data-time="5000"
        >
            у темряву страхів
        </div>


        <div
            class="line"
            data-time="4800"
        >
            саме така подорож
        </div>


        <div
            class="line"
            data-time="4800"
        >
            винагороджує тебе
        </div>


        <div
            class="line final-line"
            data-time="7500"
        >
            квіткою папороті
        </div>


    </div>


    <button
        class="enter-button"
        id="startButton"
    >

        <span class="symbol">𒀭</span>

        Увійти до стежки

    </button>


    <div
        class="sound-hint"
        id="soundHint"
    >
        торкнися екрана, щоб почути ліс
    </div>


</main>



<script>


/* --------------------------------
   ЕЛЕМЕНТИ
-------------------------------- */

const lines =
    Array.from(
        document.querySelectorAll(".line")
    );

const button =
    document.getElementById(
        "startButton"
    );

const intro =
    document.getElementById(
        "intro"
    );

const soundHint =
    document.getElementById(
        "soundHint"
    );


/* --------------------------------
   ПІДГОТОВКА ЛІТЕР
-------------------------------- */

lines.forEach(line => {

    const text =
        line.textContent.trim();

    line.textContent = "";

    [...text].forEach(char => {

        const span =
            document.createElement("span");

        span.className =
            "letter";

        span.textContent =
            char === " "
                ? "\u00A0"
                : char;

        line.appendChild(span);

    });

});


/* --------------------------------
   ЗВУК
-------------------------------- */

let audioContext = null;

let soundUnlocked = false;


function unlockSound() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }

    soundUnlocked = true;

    soundHint.classList.remove(
        "show"
    );

}


/* --------------------------------
   ШЕЛЕСТ ЛИСТЯ
-------------------------------- */

function createLeafSound() {

    if (!audioContext) return;

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }


    const duration = 0.75;


    const buffer =
        audioContext.createBuffer(
            1,
            audioContext.sampleRate *
            duration,
            audioContext.sampleRate
        );


    const data =
        buffer.getChannelData(0);


    for (
        let i = 0;
        i < data.length;
        i++
    ) {

        const fade =
            Math.sin(
                Math.PI *
                i /
                data.length
            );

        data[i] =
            (
                Math.random() * 2 - 1
            )
            *
            fade
            *
            0.42;

    }


    const source =
        audioContext.createBufferSource();

    source.buffer =
        buffer;


    const filter =
        audioContext.createBiquadFilter();

    filter.type =
        "bandpass";

    filter.frequency.value =
        2100;

    filter.Q.value =
        0.65;


    const gain =
        audioContext.createGain();


    const now =
        audioContext.currentTime;


    gain.gain.setValueAtTime(
        0.0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        0.13,
        now + 0.10
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );


    source
        .connect(filter)
        .connect(gain)
        .connect(
            audioContext.destination
        );


    source.start();

}


/* --------------------------------
   ПОЯВА ЛІТЕР
-------------------------------- */

function revealLetters(line) {

    const letters =
        Array.from(
            line.querySelectorAll(
                ".letter"
            )
        );


    letters.forEach(letter => {

        letter.classList.remove(
            "appear"
        );

    });


    /*
       Літери не летять.
       Вони проявляються
       одна за одною,
       народжуючись
       у центрі власного слова.
    */

    letters.forEach(
        (letter, index) => {

            setTimeout(
                () => {

                    letter.classList.add(
                        "appear"
                    );

                },

                45 * index
            );

        }
    );

}


/* --------------------------------
   ПОКАЗ ФРАЗ
-------------------------------- */

function showLine(index) {

    if (
        index >= lines.length
    ) {

        setTimeout(
            () => {

                button.classList.add(
                    "show"
                );

            },

            1300
        );

        return;

    }


    const line =
        lines[index];


    if (soundUnlocked) {

        createLeafSound();

    }


    line.classList.remove(
        "hidden"
    );


    line.classList.add(
        "visible"
    );


    revealLetters(line);


    const time =
        Number(
            line.dataset.time
        );


    setTimeout(
        () => {

            line.classList.remove(
                "visible"
            );

            line.classList.add(
                "hidden"
            );


            setTimeout(
                () => {

                    showLine(
                        index + 1
                    );

                },

                1500
            );

        },

        time
    );

}


/* --------------------------------
   ПЕРША ВЗАЄМОДІЯ
-------------------------------- */

document.addEventListener(
    "pointerdown",
    () => {

        if (!soundUnlocked) {

            unlockSound();

        }

    },
    { once: true }
);


/* --------------------------------
   ПОЧАТОК
-------------------------------- */

setTimeout(
    () => {

        soundHint.classList.add(
            "show"
        );

        showLine(0);

    },

    1800
);


/* --------------------------------
   КНОПКА
-------------------------------- */

button.addEventListener(
    "click",
    () => {

        unlockSound();


        intro.classList.add(
            "fade-out"
        );


        setTimeout(
            () => {

                console.log(
                    "Починається подорож до темного лісу"
                );

            },

            2500
        );

    }
);


</script>


</body>

</html>
