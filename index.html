<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Стежка до власної квітки папороті</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="introScene" class="scene">

<section id="choiceScene" class="scene next-scene" hidden>
    <div class="choice-panel">
        <p class="choice-question">
            Навіщо Тобі потрібна квітка папороті?
        </p>

        <div class="choice-list">
            <button class="choice-button" data-answer="1">
                Мене стримують страхи.
            </button>

            <button class="choice-button" data-answer="2">
                Я відчуваю власну слабкість.
            </button>

            <button class="choice-button" data-answer="3">
                Я розгубилася/-вся і не знаю, куди рухатися.
            </button>

            <button class="choice-button" data-answer="4">
                Я ніби заважаю собі рухатися вперед.
            </button>

            <button class="choice-button" data-answer="5">
                Я хочу краще зрозуміти себе.
            </button>
        </div>

        <button id="enterForestButton" class="start-button" hidden>
            <span>Увійти до лісу</span>
        </button>
    </div>
</section>

<section id="forestScene" class="scene forest-scene" hidden>
    <img id="forestImage" alt="Темна лісова стежка">

    <p id="forestPrompt" hidden>
        Обери свою квітку папороті
    </p>
</section>

        <!-- КНОПКА ПОЧАТКУ -->
       <button id="startButton" class="start-button">
    <span>Стати на стежку</span>
</button>


        <!-- ТЕКСТ -->
        <div class="intro-text">

            <!-- ПЕРША ТРІЙКА -->
            <div class="text-group" id="group1">

                <div class="line">Кажуть</div>

                <div class="line">що квітки папороті</div>

                <div class="line">не існує.</div>

            </div>


            <!-- ДРУГА ТРІЙКА -->
            <div class="text-group" id="group2">

                <div class="line">Але деякі стежки</div>

                <div class="line">ведуть тебе</div>

                <div class="line">у темряву твоїх страхів.</div>

            </div>


            <!-- ТРЕТЯ ТРІЙКА -->
            <div class="text-group" id="group3">

                <div class="line">І саме така подорож</div>

                <div class="line">винагороджує тебе</div>

                <div class="line final-line">квіткою папороті</div>

            </div>

        </div>

    </main>


    <!-- ЗВУКИ -->
    <!--
       Якщо аудіофайли лежать прямо в корені репозиторію,
       залишаємо так.

       Якщо вони знаходяться у папці sounds,
       треба буде додати sounds/ перед назвою.
    -->

    <audio id="leafSound1" preload="auto">
        <source src="foliage-rustle-of-leaves1.mp3" type="audio/mpeg">
    </audio>

    <audio id="leafSound2" preload="auto">
        <source src="foliage-rustle-of-leaves-2.mp3" type="audio/mpeg">
    </audio>

    <audio id="gongSound" preload="auto">
        <source src="gong.mp3" type="audio/mpeg">
    </audio>


    <script src="script.js"></script>

</body>
</html>
