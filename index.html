<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Стежка до власної квітки папороті</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="introScene" class="scene">

        <div class="intro-text" aria-live="polite">

            <div class="line" id="line1">Кажуть</div>

            <div class="line" id="line2">що квітки папороті</div>

            <div class="line" id="line3">не існує.</div>

            <div class="line" id="line4">Але деякі стежки</div>

            <div class="line" id="line5">ведуть тебе</div>

            <div class="line" id="line6">у темряву твоїх страхів.</div>

            <div class="line" id="line7">І саме така подорож</div>

            <div class="line" id="line8">винагороджує тебе</div>

            <div class="line final-line" id="line9">
                <span>квіткою папороті</span>
            </div>

        </div>

    </main>

    <!-- Звуки -->
    <audio id="leafSound1" preload="auto">
        <source src="sounds/foliage-rustle-of-leaves1.mp3" type="audio/mpeg">
    </audio>

    <audio id="leafSound2" preload="auto">
        <source src="sounds/foliage-rustle-of-leaves-2.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>

</body>
</html>
